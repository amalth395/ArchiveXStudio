{% extends 'base.html' %}

{% block title %}Cart{% endblock %}

{% block content %}

<style>

.cart-container{
    max-width:1100px;
    margin:40px auto;
    padding:20px;
}

.cart-title{
    text-align:center;
    font-size:60px;
    margin-bottom:50px;
    color:white;
    text-shadow:0 0 20px rgba(255,0,0,0.3);
}

.cart-card{
    display:flex;
    align-items:center;
    gap:25px;

    background:linear-gradient(
        145deg,
        rgba(20,20,20,0.95),
        rgba(10,10,10,0.95)
    );

    border-radius:28px;
    padding:22px;
    margin-bottom:30px;

    box-shadow:
    0 20px 50px rgba(0,0,0,0.6),
    inset 0 1px 1px rgba(255,255,255,0.05);

    transition:0.4s ease;

    transform-style:preserve-3d;
    backdrop-filter:blur(12px);

    border:1px solid rgba(255,255,255,0.05);
}

.cart-card:hover{

    transform:
    perspective(1200px)
    rotateX(3deg)
    rotateY(-3deg)
    translateY(-10px);

    box-shadow:
    0 30px 60px rgba(0,0,0,0.8),
    0 0 25px rgba(255,0,0,0.15);
}

.cart-card img{
    width:140px;
    height:140px;
    object-fit:cover;
    border-radius:20px;

    box-shadow:
    0 15px 30px rgba(0,0,0,0.5);
}

.cart-info{
    flex:1;
}

.cart-info h2{
    font-size:36px;
    margin-bottom:10px;
    color:white;
}

.price{
    font-size:32px;
    color:#ff2e2e;
    margin-bottom:20px;
    font-weight:bold;
}

.remove-btn{
    background:transparent;
    color:white;
    border:1px solid red;
    padding:12px 22px;
    border-radius:12px;
    cursor:pointer;
    font-size:15px;
    transition:0.3s;
}

.remove-btn:hover{
    background:red;
}

.bottom-section{
    margin-top:50px;

    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:20px;
}

.total{
    font-size:42px;
    color:white;
}

.checkout-btn{
    background:#ff1a1a;
    color:white;
    text-decoration:none;

    padding:18px 40px;
    border-radius:16px;

    font-size:20px;
    font-weight:bold;

    transition:0.3s ease;

    box-shadow:
    0 10px 25px rgba(255,0,0,0.4);
}

.checkout-btn:hover{

    transform:
    translateY(-5px)
    scale(1.03);

    background:#ff3333;

    box-shadow:
    0 20px 40px rgba(255,0,0,0.5);
}

.empty-cart{
    text-align:center;
    font-size:28px;
    color:#aaa;
    margin-top:100px;
}

@media(max-width:768px){

    .cart-card{
        flex-direction:column;
        text-align:center;
    }

    .cart-card img{
        width:100%;
        height:250px;
    }

    .cart-title{
        font-size:42px;
    }

    .cart-info h2{
        font-size:28px;
    }

    .price{
        font-size:24px;
    }

    .total{
        font-size:32px;
    }

}

</style>

<div class="cart-container">

    <h1 class="cart-title">
        Your Cart
    </h1>

    <div id="cart-items"></div>

    <div class="bottom-section">

        <h2 class="total">
    Total: <span id="total-price">₹0</span>
</h2>

        <a href="{% url 'checkout' %}" class="checkout-btn">
            Proceed To Checkout
        </a>

    </div>

</div>

<script>

const cartItemsContainer = document.getElementById("cart-items");

const totalPrice = document.getElementById("total-price");

let cart = JSON.parse(localStorage.getItem("cart")) || [];

function renderCart(){

    cartItemsContainer.innerHTML = "";

    let total = 0;

    if(cart.length === 0){

        cartItemsContainer.innerHTML = `
        <div class="empty-cart">
            Your cart is empty 🛒
        </div>
        `;

        totalPrice.innerText = 0;

        return;
    }

    cart.forEach((item,index)=>{

        total += item.price;

        cartItemsContainer.innerHTML += `

        <div class="cart-card">

            <img src="${item.image}">

            <div class="cart-info">

                <h2>${item.name}</h2>

                <div class="price">
                    ₹${item.price}
                </div>

                <button class="remove-btn"
                onclick="removeItem(${index})">
                    Remove Item
                </button>

            </div>

        </div>

        `;
    });

    totalPrice.innerText = `₹${total}`;

}

function removeItem(index){

    cart.splice(index,1);

    localStorage.setItem("cart",JSON.stringify(cart));

    renderCart();

    updateCartBadge();
}

function updateCartBadge(){

    const savedCart =
    JSON.parse(localStorage.getItem("cart")) || [];

    const cartCounter =
    document.getElementById("cart-count");

    if(cartCounter){

        cartCounter.innerText =
        `Cart (${savedCart.length})`;
    }
}

renderCart();
updateCartBadge();

</script>

{% endblock %}
