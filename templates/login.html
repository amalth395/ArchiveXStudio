{% extends 'base.html' %}

{% block content %}

<style>

.login-container{
    min-height:90vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.login-card{
    width:400px;
    background:#111;
    padding:40px;
    border-radius:20px;
    box-shadow:0 0 25px rgba(255,0,0,0.2);
}

.login-title{
    text-align:center;
    color:white;
    font-size:42px;
    margin-bottom:30px;
}

.input-box{
    width:100%;
    margin-bottom:20px;
}

.input-box input{
    width:100%;
    padding:15px;
    border:none;
    border-radius:12px;
    font-size:16px;
    outline:none;
}

.login-btn{
    width:100%;
    padding:15px;
    border:none;
    border-radius:12px;
    background:#ff1a1a;
    color:white;
    font-size:18px;
    cursor:pointer;
    transition:0.3s;
}

.login-btn:hover{
    background:#ff3333;
    transform:scale(1.02);
}

.register-link{
    margin-top:20px;
    text-align:center;
    color:white;
}

.register-link a{
    color:#ff4444;
    text-decoration:none;
}

</style>

<div class="login-container">

    <div class="login-card">

        <h1 class="login-title">Login</h1>

        <form method="POST">
            {% csrf_token %}

            <div class="input-box">
                <input type="email" name="email" placeholder="Enter Email" required>
            </div>

            <div class="input-box">
                <input type="password" name="password" placeholder="Enter Password" required>
            </div>

            <button type="submit" class="login-btn">
                Login
            </button>

        </form>

        <div class="register-link">
            Don't have an account?
            <a href="{% url 'register' %}">
                Register
            </a>
        </div>

    </div>

</div>

{% endblock %}
