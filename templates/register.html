{% extends 'base.html' %}

{% block title %}
Signup
{% endblock %}

{% block content %}

<style>

.signup-box{
    width:400px;
    margin:80px auto;
    background:#111;
    padding:40px;
    border-radius:20px;
}

.signup-box h1{
    text-align:center;
    margin-bottom:30px;
}

.signup-box input{
    width:100%;
    padding:15px;
    margin-bottom:20px;
    border:none;
    border-radius:10px;
}

.signup-btn{
    width:100%;
    background:red;
    color:white;
    padding:15px;
    border:none;
    border-radius:10px;
    font-size:18px;
    cursor:pointer;
}

.signup-btn:hover{
    background:#ff3333;
}

</style>

<div class="signup-box">

    <h1>Create Account</h1>

    <form method="POST">

        {% csrf_token %}

        <input type="text"
               name="username"
               placeholder="Username"
               required>

        <input type="email"
               name="email"
               placeholder="Email"
               required>

        <input type="password"
               name="password"
               placeholder="Password"
               required>

        <button type="submit"
                class="signup-btn">

            Register

        </button>

    </form>

</div>

{% endblock %}
